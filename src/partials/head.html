<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ domain }}/{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ root }}images/global/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="{{ root }}images/global/apple-touch-icon.png">
{{ font_preloads }}
<link rel="preconnect" href="https://www.googletagmanager.com">
<link rel="stylesheet" href="{{ root }}css/site.css?v={{ css_v }}">
<link rel="alternate" type="text/markdown" href="{{ md_href }}">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","@id":"{{ canonical }}#webpage","url":"{{ canonical }}","dateModified":"{{ date_modified }}","publisher":{"@id":"{{ domain }}/#org"}}</script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', {
  ad_storage: 'denied',
  ad_user_data: 'denied',
  ad_personalization: 'denied',
  analytics_storage: 'denied',
  wait_for_update: 500
});
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga4_id }}"></script>
<script>gtag('js', new Date()); gtag('config', '{{ ga4_id }}');</script>
</head>

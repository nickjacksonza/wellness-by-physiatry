<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ domain }}/{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ root }}images/global/favicon.png" type="image/png">
<link rel="preload" href="{{ root }}fonts/newsreader-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ root }}fonts/manrope-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ root }}css/site.css?v={{ css_v }}">
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', {
  ad_storage: 'denied',
  ad_user_data: 'denied',
  ad_personalization: 'denied',
  analytics_storage: 'denied',
  wait_for_update: 500
});
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga4_id }}"></script>
<script>gtag('js', new Date()); gtag('config', '{{ ga4_id }}');</script>
</head>

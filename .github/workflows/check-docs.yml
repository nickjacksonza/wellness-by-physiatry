name: Check docs/ matches the sources

# docs/ is generated by build.py from src/, css/ and js/. A change made only in
# docs/ is lost at the next build. This check rebuilds the site and fails if
# the committed docs/ differs, so a hand edit is caught when it is pushed.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.py reads each page's last commit date

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the site
        run: python build.py

      - name: Fail if docs/ was edited by hand
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ does not match what build.py produces from src/, css/ and js/."
            echo "Make the change in the source files, run 'python build.py', and commit both."
            git diff --stat -- docs
            git diff -- docs | head -100
            exit 1
          fi
